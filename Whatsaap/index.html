<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Status de Separação</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
    }
    label {
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px;
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Status Separação</h2>

<label>Data</label>
<input type="date" id="data">

<label>Status Separação</label>
<input type="text" id="status">

<label>Horário HE</label>
<input type="time" id="he">

<label>Horário HO</label>
<input type="time" id="ho">

<label>Horário Recebimento</label>
<input type="time" id="recebimento">

<hr>

<label>Expedido - Carros</label>
<input type="number" id="exp_carros">

<label>Expedido - Tons</label>
<input type="number" id="exp_tons">

<label>Vira Programado - Carros</label>
<input type="number" id="vp_carros">

<label>Vira Programado - Tons</label>
<input type="number" id="vp_tons">

<label>Vira Não Programado - Carros</label>
<input type="number" id="vnp_carros">

<label>Vira Não Programado - Tons</label>
<input type="number" id="vnp_tons">

<button onclick="enviarWhats()">Enviar WhatsApp</button>

<script>
function enviarWhats() {

  var data = document.getElementById("data").value;
  var status = document.getElementById("status").value;
  var he = document.getElementById("he").value;
  var ho = document.getElementById("ho").value;
  var receb = document.getElementById("recebimento").value;

  var expCarros = document.getElementById("exp_carros").value;
  var expTons = document.getElementById("exp_tons").value;

  var vpCarros = document.getElementById("vp_carros").value;
  var vpTons = document.getElementById("vp_tons").value;

  var vnpCarros = document.getElementById("vnp_carros").value;
  var vnpTons = document.getElementById("vnp_tons").value;

  var mensagem =
    "*STATUS SEPARAÇÃO*%0A" +
    "Data: " + data + "%0A" +
    "Status: " + status + "%0A%0A" +

    "Horários:%0A" +
    "HE: " + he + "%0A" +
    "HO: " + ho + "%0A" +
    "Recebimento: " + receb + "%0A%0A" +

    "Expedido:%0A" +
    "Carros: " + expCarros + " | Tons: " + expTons + "%0A%0A" +

    "Vira Programado:%0A" +
    "Carros: " + vpCarros + " | Tons: " + vpTons + "%0A%0A" +

    "Vira Não Programado:%0A" +
    "Carros: " + vnpCarros + " | Tons: " + vnpTons;

  var telefone = "11960934563"; // coloque aqui o WhatsApp destino

  var url = "https://wa.me/" + telefone + "?text=" + mensagem;

  window.open(url, "_blank");
}
</script>

</body>
</html>
