<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Passagem de Turno</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 15px;
            background: #e9ecef;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
            margin-top: 20px;
        }
        
        .brand-corner {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            font-weight: 900;
        }
        .brand-n { color: #0056b3; }
        .brand-dot { color: #ff9800; }

        h2 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #25D366;
            padding-bottom: 15px;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .section-title {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 20px;
            display: block;
            font-weight: bold;
            color: #495057;
            border-left: 5px solid #25D366;
            font-size: 13px;
            text-transform: uppercase;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 15px;
            color: #333;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            font-size: 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 18px;
            background: #25D366;
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover { background: #128C7E; }
    </style>
</head>
<body>

<div class="box">
    <div class="brand-corner">
        <span class="brand-n">N</span><span class="brand-dot">.</span>
    </div>

    <h2>Passagem de Turno</h2>

    <label>📅 Data</label>
    <input type="date" id="data">

    <label>🚦 Status Separação</label>
    <select id="status">
        <option value="✅ Em dia">✅ Em dia</option>
        <option value="🟡 Em alerta">🟡 Em alerta</option>
        <option value="🔴 Atrasado">🔴 Atrasado</option>
    </select>

    <span class="section-title">⏰ Controle de Horários</span>
    <div class="grid">
        <div>
            <label>🕒 HE</label>
            <input type="time" id="he">
        </div>
        <div>
            <label>⚙️ HO</label>
            <input type="time" id="ho">
        </div>
    </div>
    <label>📥 Recebimento</label>
    <input type="time" id="recebimento">

    <span class="section-title">📊 Produção</span>
    
    <label>🚛 Expedido</label>
    <div class="grid">
        <input type="number" id="exp_carros" placeholder="🚚 Carros">
        <input type="number" id="exp_tons" placeholder="⚖️ Tons">
    </div>

    <label>🔄 Vira Programado</label>
    <div class="grid">
        <input type="number" id="vp_carros" placeholder="🚚 Carros">
        <input type="number" id="vp_tons" placeholder="⚖️ Tons">
    </div>

    <label>⚠️ Vira Não Programado</label>
    <div class="grid">
        <input type="number" id="vnp_carros" placeholder="🚚 Carros">
        <input type="number" id="vnp_tons" placeholder="⚖️ Tons">
    </div>

    <button onclick="enviarWhats()">📲 Enviar para WhatsApp</button>
</div>

<script>
function enviarWhats(){
    const data = document.getElementById("data").value;
    const status = document.getElementById("status").value;
    const he = document.getElementById("he").value || "--:--";
    const ho = document.getElementById("ho").value || "--:--";
    const receb = document.getElementById("recebimento").value || "--:--";
    const expC = document.getElementById("exp_carros").value || 0;
    const expT = document.getElementById("exp_tons").value || 0;
    const vpC = document.getElementById("vp_carros").value || 0;
    const vpT = document.getElementById("vp_tons").value || 0;
    const vnpC = document.getElementById("vnp_carros").value || 0;
    const vnpT = document.getElementById("vnp_tons").value || 0;

    const dataF = data ? data.split('-').reverse().join('/') : "--/--/--";

    let mensagem = "*N. RELATÓRIO DE PASSAGEM DE TURNO*\n\n";
    mensagem += "📅 *DATA:* " + dataF + "\n";
    mensagem += "🚦 *STATUS:* " + status + "\n\n";
    
    mensagem += "🕒 *HORÁRIOS*\n";
    mensagem += "- HE: " + he + "\n";
    mensagem += "- HO: " + ho + "\n";
    mensagem += "- Receb.: " + receb + "\n\n";

    mensagem += "🚛 *EXPEDIDO*\n";
    mensagem += "- 🚚 Carros: " + expC + "\n";
    mensagem += "- ⚖️ Tons: " + expT + " t\n\n";

    mensagem += "🔄 *VIRA PROGRAMADO*\n";
    mensagem += "- 🚚 Carros: " + vpC + "\n";
    mensagem += "- ⚖️ Tons: " + vpT + " t\n\n";

    mensagem += "⚠️ *VIRA NÃO PROGRAMADO*\n";
    mensagem += "- 🚚 Carros: " + vnpC + "\n";
    mensagem += "- ⚖️ Tons: " + vnpT + " t\n\n";
    mensagem += "━━━━━━━━━━━━━━━━━━";

    const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(mensagem);
    window.open(url, "_blank");
}
</script>

</body>
</html>
