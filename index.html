<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL N. | MULTI-THEME SYSTEM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #05070a;
            --bg-card: rgba(15, 20, 30, 0.8);
            --text-main: #ffffff;
            --text-label: #888888;
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-blue: #00d4ff;
            --neon-green: #00ff88;
            --input-bg: rgba(0,0,0,0.3);
        }

        .light-mode {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --text-label: #555555;
            --border-color: #dcdde1;
            --neon-blue: #0056b3;
            --neon-green: #25D366;
            --input-bg: #f8f9fa;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.4s ease;
        }

        .theme-switch {
            position: absolute; top: 20px; right: 20px; cursor: pointer;
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 10px 15px; border-radius: 50px; display: flex;
            align-items: center; gap: 10px; z-index: 100; font-size: 14px;
        }

        .box {
            background: var(--bg-card); backdrop-filter: blur(20px);
            padding: 30px; border-radius: 25px; border: 1px solid var(--border-color);
            width: 90%; max-width: 500px; margin: 40px 0; transition: all 0.4s ease;
        }

        .brand { text-align: center; font-size: 26px; font-weight: 900; }
        .brand span { color: var(--neon-blue); }

        .section-header {
            background: rgba(0,0,0,0.03); padding: 8px 12px; border-radius: 6px;
            margin: 20px 0 10px; font-size: 12px; font-weight: 800;
            color: var(--neon-green); border-left: 4px solid var(--neon-green);
            text-transform: uppercase;
        }

        label { font-size: 11px; color: var(--text-label); display: flex; align-items: center; gap: 8px; margin-top: 15px; text-transform: uppercase; font-weight: 600; }
        
        input, select {
            width: 100%; padding: 12px; margin-top: 6px;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 10px; color: var(--text-main); font-size: 15px; box-sizing: border-box;
        }

        input:disabled { opacity: 0.4; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .fin-check {
            display: flex; align-items: center; gap: 5px; font-size: 10px;
            margin-top: 5px; color: var(--neon-blue); cursor: pointer;
        }
        .fin-check input { width: auto; margin: 0; }

        button.btn-zap {
            width: 100%; padding: 20px; margin-top: 30px;
            background: linear-gradient(45deg, #128C7E, #25D366);
            border: none; border-radius: 50px; color: white;
            font-weight: 900; text-transform: uppercase; cursor: pointer;
        }

        .status-danger { border: 2px solid #ff4d4d !important; animation: pulse-danger 2s infinite; }
    </style>
</head>
<body>

<div class="theme-switch" onclick="toggleTheme()">
    <i id="theme-icon" class="fas fa-moon"></i>
    <span id="theme-text">Modo Escuro</span>
</div>

<div class="box" id="mainBox">
    <div class="brand"><span>N</span>.</div>
    <p style="text-align: center; font-size: 12px; opacity: 0.7; margin-top: 0;">Relatório de Passagem de Turno</p>

    <div class="grid">
        <div>
            <label><i class="far fa-calendar-alt"></i> Data</label>
            <input type="date" id="data">
        </div>
        <div>
            <label><i class="fas fa-traffic-light"></i> Status Separação</label>
            <select id="status" onchange="checkStatus(this)">
                <option value="✅ Em dia">✅ Em dia</option>
                <option value="🟡 Em alerta">🟡 Em alerta</option>
                <option value="🔴 Atrasado">🔴 Atrasado</option>
            </select>
        </div>
    </div>

    <div class="section-header">⏰ Controle de Horários</div>
    <div class="grid">
        <div>
            <label><i class="far fa-clock"></i> Hora (HE)</label>
            <input type="time" id="he">
            <label class="fin-check"><input type="checkbox" onchange="toggleInput('he', this)"> Finalizado</label>
        </div>
        <div>
            <label><i class="fas fa-cog"></i> Hora (HO)</label>
            <input type="time" id="ho">
            <label class="fin-check"><input type="checkbox" onchange="toggleInput('ho', this)"> Finalizado</label>
        </div>
    </div>
    
    <div class="grid">
        <div>
            <label><i class="fas fa-inbox"></i> Recebimento</label>
            <input type="time" id="receb">
            <label class="fin-check"><input type="checkbox" onchange="toggleInput('receb', this)"> Finalizado</label>
        </div>
        <div>
            <label><i class="fas fa-check-double"></i> Padronização</label>
            <input type="time" id="padron">
            <label class="fin-check"><input type="checkbox" onchange="toggleInput('padron', this)"> Finalizado</label>
        </div>
    </div>

    <div>
        <label><i class="fas fa-tags"></i> Etiquetagem</label>
        <input type="text" id="etiq" placeholder="Ex: Ok, Pendente, 100%...">
        <label class="fin-check"><input type="checkbox" onchange="toggleInput('etiq', this)"> Finalizado</label>
    </div>

    <div class="section-header">📊 Produção de Turno</div>
    
    <label><i class="fas fa-truck"></i> Expedido</label>
    <div class="grid">
        <input type="number" id="exp_c" placeholder="🚚 Carros">
        <input type="number" id="exp_t" placeholder="⚖️ Tons">
    </div>

    <label><i class="fas fa-redo-alt"></i> Vira Programado</label>
    <div class="grid">
        <input type="number" id="vp_c" placeholder="🚚 Carros">
        <input type="number" id="vp_t" placeholder="⚖️ Tons">
    </div>

    <label><i class="fas fa-exclamation-circle"></i> Vira Não Programado</label>
    <div class="grid">
        <input type="number" id="vnp_c" placeholder="🚚 Carros">
        <input type="number" id="vnp_t" placeholder="⚖️ Tons">
    </div>

    <label><i class="fas fa-history"></i> Atrasado</label>
    <div class="grid">
        <input type="number" id="atras_c" placeholder="🚚 Carros">
        <input type="number" id="atras_t" placeholder="⚖️ Tons">
    </div>

    <button class="btn-zap" onclick="enviar()">
        <i class="fab fa-whatsapp"></i> Enviar WhatsApp
    </button>
</div>

<script>
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        body.classList.toggle('light-mode');
        if (body.classList.contains('light-mode')) {
            icon.className = 'fas fa-sun';
            text.innerText = 'Modo Claro';
        } else {
            icon.className = 'fas fa-moon';
            text.innerText = 'Modo Escuro';
        }
        playFeedbackSound(400);
    }

    function toggleInput(id, cb) {
        const input = document.getElementById(id);
        input.disabled = cb.checked;
        if(cb.checked) input.value = "";
    }

    function checkStatus(sel) {
        const box = document.getElementById('mainBox');
        if (sel.value.includes('🔴')) {
            box.classList.add('status-danger');
        } else {
            box.classList.remove('status-danger');
        }
    }

    function playFeedbackSound(freq) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function getVal(id) {
        const input = document.getElementById(id);
        const cb = input.nextElementSibling.querySelector('input');
        if (cb && cb.checked) return "✅ FINALIZADO";
        return input.value || "---";
    }

    function enviar() {
        playFeedbackSound(600);
        if (navigator.vibrate) navigator.vibrate(50);

        const d = document.getElementById("data").value.split('-').reverse().join('/');
        const s = document.getElementById("status").value;
        
        const he = getVal("he");
        const ho = getVal("ho");
        const rec = getVal("receb");
        const pad = getVal("padron");
        const etiq = getVal("etiq");
        
        const exp = `🚚 ${document.getElementById("exp_c").value || 0} | ⚖️ ${document.getElementById("exp_t").value || 0}t`;
        const vp = `🚚 ${document.getElementById("vp_c").value || 0} | ⚖️ ${document.getElementById("vp_t").value || 0}t`;
        const vnp = `🚚 ${document.getElementById("vnp_c").value || 0} | ⚖️ ${document.getElementById("vnp_t").value || 0}t`;
        const atras = `🚚 ${document.getElementById("atras_c").value || 0} | ⚖️ ${document.getElementById("atras_t").value || 0}t`;

        let msg = `*N. PASSAGEM DE TURNO*\n`;
        msg += `📅 DATA: ${d || '--/--/--'}\n\n`; 
        msg += `🚦 STATUS SEPARAÇÃO: ${s}\n`; 
        msg += `*HORÁRIOS*\n- HE: ${he}\n- HO: ${ho}\n- Receb: ${rec}\n- Padronização: ${pad}\n- Etiquetagem: ${etiq}\n\n`;
        msg += `*EXPEDIDO*\n${exp}\n\n`;
        msg += `*VIRA PROG*\n${vp}\n\n`;
        msg += `*VIRA NÃO PROG*\n${vnp}\n\n`;
        msg += `*ATRASADO*\n${atras}\n\n`;
        msg += `━━━━━━━━━━━━━━`;

        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, "_blank");
    }

    document.getElementById('data').valueAsDate = new Date();
</script>

</body>
</html>
